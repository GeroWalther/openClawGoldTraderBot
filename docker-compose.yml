services:
  trader:
    build: .
    container_name: gold-trader
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - .env
    volumes:
      - trader-data:/app/data
      - ./journal:/app/journal
      - ./.env:/app/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/trades.db
      # TRADING_MODE: "classic" = in-container fixed-strategy cron pipeline
      #               "ai"      = host-side AI orchestrator runs scans; container only monitors
      - TRADING_MODE=${TRADING_MODE:-classic}

volumes:
  trader-data:
